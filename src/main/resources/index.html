<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojistik Yönetim Sistemi</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <h1>🚚 Lojistik Yönetim Sistemi</h1>

    <p class="subtitle">
        Horoz Lojistik Operasyon Yönetim Paneli
    </p>

    <div class="menu">

        <div class="card" id="kargoCard">
            <div class="icon">📦</div>
            <h2>Kargo Yönetimi</h2>
            <p>Kargo ekleme, listeleme ve takip işlemleri</p>
        </div>

        <div class="card" id="stokCard">
            <div class="icon">📦</div>
            <h2>Stok Kontrol</h2>
            <p>Ürün stoklarını yönet</p>
        </div>

        <div class="card" id="ulasimCard">
            <div class="icon">🚚</div>
            <h2>Ulaşım</h2>
            <p>Rota ve araç yönetimi</p>
        </div>

        <div class="card" id="mesaiCard">
            <div class="icon">⏰</div>
            <h2>Fazla Mesai</h2>
            <p>Personel mesai kayıtları</p>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>

</html>
