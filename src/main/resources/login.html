<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojistik Yönetim Sistemi - Giriş</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Login sayfasına özel ek stiller (style.css ile uyumlu) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 0;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #CBD5E1;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #64748B;
            transition: 0.3s;
        }
        .auth-tab.active {
            color: #1E3A8A;
            border-bottom: 4px solid #2563EB;
            margin-bottom: -2px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .auth-form label {
            display: block;
            font-weight: bold;
            color: #1E3A8A;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #2563EB;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background-color: #1E40AF;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .error { color: #EF4444; }
        .success { color: #10B981; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container login-container">
    <h1>Lojistik Sistemi</h1>
    <p class="subtitle">Devam etmek için lütfen oturum açın</p>

    <!-- Sekmeler -->
    <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchAuthTab('login')">Giriş Yap</div>
        <div class="auth-tab" onclick="switchAuthTab('register')">Kayıt Ol</div>
    </div>

    <!-- Giriş Formu -->
    <div id="loginSection" class="auth-form">
        <form onsubmit="handleLogin(event)">
            <label>Kullanıcı Adı</label>
            <input type="text" id="loginKullaniciAdi" required>

            <label>Şifre</label>
            <input type="password" id="loginSifre" required>

            <button type="submit" class="auth-btn">Giriş Yap</button>
        </form>
    </div>

    <!-- Kayıt Ol Formu -->
    <div id="registerSection" class="auth-form hidden">
        <form onsubmit="handleRegister(event)">
            <!-- Türkçe yorum: Kullanıcı adı için minimum karakter sınırı eklendi -->
            <label>Kullanıcı Adı</label>
            <input type="text" id="regKullaniciAdi" minlength="3" required>

            <!-- Türkçe yorum: E-posta alanı HTML5 tipiyle doğrulanıyor -->
            <label>E-posta Adresi</label>
            <input type="email" id="regEmail" required>

            <!-- Türkçe yorum: Şifre için minimum karakter sınırı eklendi -->
            <label>Şifre</label>
            <input type="password" id="regSifre" minlength="6" required>

            <button type="submit" class="auth-btn">Kayıt Ol (Onaya Gönder)</button>
        </form>
    </div>

    <div id="messageBox" class="message"></div>
</div>

<script src="js/login.js"></script>
<script src ="js/main.js"></script>
</body>
</html>
